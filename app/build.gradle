apply plugin: "com.android.application"

repositories {
	google()
	mavenCentral()
}

android {
	compileSdkVersion 29
	buildToolsVersion "29.0.3"

	compileOptions {
		sourceCompatibility JavaVersion.VERSION_1_8
		targetCompatibility JavaVersion.VERSION_1_8
	}

	defaultConfig {
		applicationId "org.hosts.connection"
		minSdkVersion 23
		targetSdkVersion 29
		versionCode 2
		versionName "1.0"
	}
}

dependencies {
	compile "androidx.appcompat:appcompat:1.1.0"
	compile "com.google.android.material:material:1.1.0"
	compile "androidx.constraintlayout:constraintlayout:1.1.3"
	compile "androidx.recyclerview:recyclerview:1.1.0"
	compile "androidx.drawerlayout:drawerlayout:1.1.0"
}
